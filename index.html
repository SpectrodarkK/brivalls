<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brivalls de Cornudella</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blau: #29327a;
    --blau-fosc: #1e2560;
    --blau-clar: #eaebf5;
    --groc: #f39c12;
    --groc-clar: #fef9e7;
    --verd: #27ae60;
    --verd-clar: #eafaf1;
    --gris-fosc: #1a1a2e;
    --gris-mig: #4a4a6a;
    --gris-clar: #f4f4f8;
    --blanc: #ffffff;
    --text: #1a1a2e;
    --text-suau: #6c6c8a;
    --vora: #e0e0ee;
    --ombra: 0 2px 12px rgba(26,26,46,0.10);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gris-clar); color: var(--text); max-width: 480px; margin: 0 auto; min-height: 100vh; }
  .cap { background: #e8e8e8; padding: 12px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .cap-title { font-size: 17px; font-weight: 600; flex: 1; color: #1a1a1a; }
  .cap-subtitle { font-size: 11px; color: #555; }
  .btn-candau { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px; }
  .contingut { padding: 12px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px; overflow: hidden; }
  .card-cap { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--vora); }
  .card-titol { font-size: 15px; font-weight: 600; }
  .sessio-item { padding: 14px 16px; border-bottom: 1px solid var(--vora); cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .sessio-item:last-child { border-bottom: none; }
  .sessio-item:nth-child(even) { background: var(--gris-clar); }
  .sessio-data { font-size: 13px; font-weight: 700; color: var(--blau); min-width: 40px; text-align: center; }
  .sessio-mes { font-size: 10px; color: var(--text-suau); text-transform: uppercase; }
  .sessio-info { flex: 1; }
  .sessio-titol { font-size: 14px; font-weight: 600; }
  .sessio-subtitol { font-size: 12px; color: var(--text-suau); margin-top: 2px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--blau-clar); color: var(--blau); }
  .buit { padding: 40px 20px; text-align: center; color: var(--text-suau); }
  .buit-ico { font-size: 40px; margin-bottom: 8px; }
  .detall-back { display: flex; align-items: center; gap: 8px; padding: 12px 16px; cursor: pointer; color: var(--blau); font-weight: 600; border-bottom: 1px solid var(--vora); }
  .castell-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px; overflow: hidden; }
  .castell-nom { padding: 12px 16px; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--vora); }
  svg { width: 100%; height: auto; display: block; cursor: default; }
  .loading { padding: 40px; text-align: center; color: var(--text-suau); font-size: 16px; }
</style>
</head>

</div>

<script>
const SUPABASE_URL = 'https://djxugrnyvbmziwttaszo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqeHVncm55dmJteml3dHRhc3pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNzgzNDEsImV4cCI6MjEwNDk1NDM0MX0.d33KiYWYbsmLKmTkik8W2gmeRNL5dnFPDxCfjzjoPHE';

const NOMS_TIPUS = {
  'pilar': {nom:'Pilar', ico:'🏛️'},
  '2':     {nom:'Castell de 2', ico:'🏛️'},
  '3':     {nom:'Castell de 3', ico:'🏛️'},
  '3ag':   {nom:'3 amb agulla', ico:'🏰'},
  '4':     {nom:'Castell de 4', ico:'🏛️'},
  '5':     {nom:'Castell de 5', ico:'🏆'},
};

function tipusSessio(t) {
  return {assaig:'Assaig', actuacio:'Actuació', diada:'Diada'}[t] || t;
}

function formatData(str) {
  if (!str) return '';
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('ca-ES', {day:'2-digit', month:'long', year:'numeric'});
}

function diaNum(str) {
  if (!str) return '';
  return new Date(str + 'T00:00:00').getDate();
}

function mesAbreujat(str) {
  if (!str) return '';
  return new Date(str + 'T00:00:00').toLocaleDateString('ca-ES', {month:'short'});
}

function anaTecnica() {
  document.getElementById('pin-input').value = '';
  document.getElementById('pin-error').style.display = 'none';
  document.getElementById('btn-accedir').textContent = 'Accedir';
  document.getElementById('modal-pin').style.display = 'flex';
  setTimeout(() => document.getElementById('pin-input').focus(), 100);
}

function tancaModal() {
  document.getElementById('modal-pin').style.display = 'none';
}

async function verificaPin() {
  const pin = document.getElementById('pin-input').value;
  const btn = document.getElementById('btn-accedir');
  document.getElementById('pin-error').style.display = 'none';
  btn.textContent = '⏳ Verificant...';
  btn.disabled = true;
  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: 'validacio-tecnica@brivalls.cat', password: pin })
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    // Guardar token per a tecnica.html
    sessionStorage.setItem('sb-token', data.access_token);
    window.location.href = 'tecnica.html';
  } catch(e) {
    btn.textContent = 'Accedir';
    btn.disabled = false;
    document.getElementById('pin-error').style.display = 'block';
    document.getElementById('pin-input').value = '';
  }
}

async function carregaSessions() {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/sessions?select=*&order=data.desc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    const sessions = await res.json();
    renderitzaSessions(sessions || []);
  } catch(e) {
    document.getElementById('contingut').innerHTML = '<div class="buit"><div class="buit-ico">⚠️</div><div>Error carregant les sessions</div></div>';
  }
}

function renderitzaSessions(sessions) {
  const cont = document.getElementById('contingut');
  document.getElementById('cap-sub').textContent = sessions.length + ' sessions';
  if (!sessions.length) {
    cont.innerHTML = '<div class="buit"><div class="buit-ico">📅</div><div>Encara no hi ha sessions</div></div>';
    return;
  }
  cont.innerHTML = '<div class="card">' + sessions.map(s => `
    <div class="sessio-item" onclick="obreDetall(${JSON.stringify(s).replace(/"/g,'&quot;')})">
      <div style="text-align:center;min-width:40px;">
        <div class="sessio-data">${diaNum(s.data)}</div>
        <div class="sessio-mes">${mesAbreujat(s.data)}</div>
      </div>
      <div class="sessio-info">
        <div class="sessio-titol">${tipusSessio(s.tipus)}${s.lloc ? ' · ' + s.lloc : ''}</div>
        <div class="sessio-subtitol">${formatData(s.data)}${s.hora ? ' · ' + s.hora : ''}</div>
      </div>
      <span class="tag">${(s.castells||[]).length || 0} ${(s.castells||[]).length===1?'castell':'castells'}</span>
    </div>
  `).join('') + '</div>';
}

function obreDetall(s) {
  const castells = (s.castells || []).filter(c => c.pinya);
  const cont = document.getElementById('contingut');
  document.getElementById('cap-sub').textContent = tipusSessio(s.tipus);

  let html = `<div class="detall-back" onclick="carregaSessions()">← Sessions</div>`;
  html += `<div style="padding:12px 0 4px;font-size:13px;color:var(--text-suau);">${formatData(s.data)}${s.lloc?' · '+s.lloc:''}</div>`;

  if (!castells.length) {
    html += '<div class="buit"><div class="buit-ico">🏛️</div><div>Sense castells assignats</div></div>';
  } else {
    castells.forEach((cas, idx) => {
      const p = cas.pinya;
      const info = NOMS_TIPUS[p.tipus] || {ico:'🏛️', nom:p.tipus};
      const num = castells.length > 1 ? ` ${idx+1}` : '';
      html += `<div class="castell-card">
        <div class="castell-nom">${info.ico} ${p.nom}${num}</div>
        <div id="svg-cas-${idx}" style="padding:8px;"></div>
      </div>`;
    });
  }

  cont.innerHTML = html;

  // Renderitzar SVGs
  castells.forEach((cas, idx) => {
    const p = cas.pinya;
    const el = document.getElementById('svg-cas-' + idx);
    if (el && p.posicions) el.innerHTML = generaSVG(p);
  });
}

function generaSVG(pinya) {
  const COLORS = {
    baix:'#1a1a2e', baix_pilar:'#1a1a2e', agulla:'#27ae60', crossa:'#f1c40f',
    contrafort:'#e8e8e8', vent:'#c0392b', lateral:'#2980b9', diagonal:'#2980b9',
    mans:'#8e44ad', tap:'#95a5a6', envoltant:'#27ae60'
  };
  const R = 5.2;
  const pos = pinya.posicions || [];
  if (!pos.length) return '';
  const xs = pos.map(p => p.cx), ys = pos.map(p => p.cy);
  const marge = R + 4;
  const minX = Math.min(...xs)-marge, maxX = Math.max(...xs)+marge;
  const minY = Math.min(...ys)-marge, maxY = Math.max(...ys)+marge;
  const W = maxX-minX, H = maxY-minY;
  const cercles = pos.map(p => {
    const color = COLORS[p.rol] || '#999';
    return `<circle cx="${p.cx}" cy="${p.cy}" r="${R}" fill="${color}" stroke="#fff" stroke-width="0.3" opacity="0.9"/>`;
  }).join('');
  return `<svg viewBox="${minX} ${minY} ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${cercles}</svg>`;
}

carregaSessions();
</script>

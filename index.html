<script>
const SUPABASE_URL = 'https://djxugrnyvbmziwttaszo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqeHVncm55dmJteml3dHRhc3pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNzgzNDEsImV4cCI6MjEwNDk1NDM0MX0.d33KiYWYbsmLKmTkik8W2gmeRNL5dnFPDxCfjzjoPHE';
const EMAIL_TECNIC = 'validacio-tecnica@brivalls.cat';

// Detectar si venim d'un email d'invitació o recuperació
(async function detectaToken() {
  // Format 1: fragment (#access_token=...)
  const hash = window.location.hash;
  const hashParams = new URLSearchParams(hash.replace('#', ''));

  // Format 2: query params (?token=...&type=invite)
  const queryParams = new URLSearchParams(window.location.search);

  const type = hashParams.get('type') || queryParams.get('type');
  const accessToken = hashParams.get('access_token');
  const refreshToken = hashParams.get('refresh_token');
  const tokenHash = queryParams.get('token_hash') || queryParams.get('token');

  if (accessToken && (type === 'invite' || type === 'recovery' || type === 'signup')) {
    // Token directe al fragment
    sessionStorage.setItem('sb-token', accessToken);
    if (refreshToken) sessionStorage.setItem('sb-refresh', refreshToken);
    sessionStorage.setItem('sb-canvia-pwd', '1');
    window.location.href = 'casteller.html';
  } else if (tokenHash && type) {
    // Token hash — cal verificar-lo primer per obtenir el JWT
    try {
      const res = await fetch(SUPABASE_URL + '/auth/v1/verify', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ token_hash: tokenHash, type })
      });
      if (res.ok) {
        const data = await res.json();
        sessionStorage.setItem('sb-token', data.access_token);
        if (data.refresh_token) sessionStorage.setItem('sb-refresh', data.refresh_token);
        sessionStorage.setItem('sb-canvia-pwd', '1');
        window.location.href = 'casteller.html';
      }
    } catch(e) { console.error('Error verificant token:', e); }
  }
})();

// Ping a Supabase per evitar que el projecte es pausi per inactivitat
(async function ping() {
  try {
    await fetch(SUPABASE_URL + '/rest/v1/sessions?select=id&limit=1', {
      headers: { 'apikey': SUPABASE_KEY }
    });
  } catch(e) {}
})();

async function login() {
  const email = document.getElementById('email').value.trim();
  const pwd = document.getElementById('pwd').value;
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error-msg');
  if (!email || !pwd) { err.textContent='Cal posar el correu i la contrasenya'; err.style.display='block'; return; }
  btn.textContent = '⏳ Entrant...'; btn.disabled = true; err.style.display='none';
  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({email, password:pwd})
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    sessionStorage.setItem('sb-token', data.access_token);
    sessionStorage.setItem('sb-refresh', data.refresh_token);
    sessionStorage.setItem('sb-email', email);
    // Redirigir segons el tipus d'usuari
    if (email === EMAIL_TECNIC) {
      window.location.href = 'tecnica.html';
    } else {
      window.location.href = 'casteller.html';
    }
  } catch(e) {
    err.textContent='Correu o contrasenya incorrectes'; err.style.display='block';
    btn.textContent='Entrar'; btn.disabled=false;
  }
}

async function recuperaContrasenya() {
  const email = document.getElementById('email').value.trim();
  if (!email) { document.getElementById('error-msg').textContent='Posa el teu correu primer'; document.getElementById('error-msg').style.display='block'; return; }
  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/recover', {
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({
        email,
        redirectTo: 'https://app.brivalls.cat/casteller.html'
      })
    });
    document.getElementById('error-msg').style.color='#27ae60';
    document.getElementById('error-msg').textContent='Email de recuperació enviat! Revisa el correu.';
    document.getElementById('error-msg').style.display='block';
  } catch(e) {
    document.getElementById('error-msg').textContent='Error enviant el correu';
    document.getElementById('error-msg').style.display='block';
  }
}
</script>

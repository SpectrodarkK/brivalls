<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brivalls — Portal Casteller</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --blau:#29327a; --blau-fosc:#1e2560; --blau-clar:#eaebf5;
  --verd:#27ae60; --verd-clar:#eafaf1;
  --text:#1a1a2e; --text-suau:#6c6c8a; --vora:#e0e0ee;
  --gris-clar:#f4f4f8; --blanc:#fff;
  --ombra:0 2px 12px rgba(26,26,46,0.10);
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--gris-clar); color:var(--text); max-width:480px; margin:0 auto; min-height:100vh; }
.cap { background:#e8e8e8; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
.cap img { height:36px; width:auto; flex-shrink:0; }
.cap-info { flex:1; }
.cap-title { font-size:16px; font-weight:600; color:#1a1a1a; }
.cap-subtitle { font-size:11px; color:#555; }
.btn-sortir { background:none; border:none; font-size:20px; cursor:pointer; padding:4px; }
.nav { display:flex; background:#fff; border-bottom:1px solid var(--vora); position:sticky; top:61px; z-index:99; }
.nav-btn { flex:1; padding:12px 4px 10px; border:none; background:none; font-size:11px; color:var(--text-suau); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; border-bottom:2px solid transparent; }
.nav-btn.actiu { color:var(--blau); border-bottom-color:var(--blau); font-weight:600; }
.nav-btn .ico { font-size:20px; }
.contingut { padding:12px; }
.card { background:#fff; border-radius:12px; box-shadow:var(--ombra); margin-bottom:12px; overflow:hidden; }
.card-cap { padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--vora); }
.card-titol { font-size:15px; font-weight:600; }
.sessio-item { padding:14px 16px; border-bottom:1px solid var(--vora); display:flex; align-items:center; gap:12px; }
.sessio-item:last-child { border-bottom:none; }
.sessio-item:nth-child(even) { background:var(--gris-clar); }
.sessio-data { font-size:18px; font-weight:700; color:var(--blau); min-width:36px; text-align:center; }
.sessio-mes { font-size:10px; color:var(--text-suau); text-transform:uppercase; text-align:center; }
.sessio-info { flex:1; }
.sessio-titol { font-size:14px; font-weight:600; }
.sessio-subtitol { font-size:12px; color:var(--text-suau); margin-top:2px; }
.toggle { position:relative; display:inline-block; width:48px; height:26px; flex-shrink:0; }
.toggle input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; inset:0; background:#ccc; border-radius:26px; cursor:pointer; transition:0.3s; }
.toggle-slider:before { content:''; position:absolute; height:20px; width:20px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:0.3s; }
.toggle input:checked + .toggle-slider { background:var(--verd); }
.toggle input:checked + .toggle-slider:before { transform:translateX(22px); }
.buit { padding:40px 20px; text-align:center; color:var(--text-suau); }
.buit-ico { font-size:40px; margin-bottom:8px; }
.panell { display:none; padding:12px; }
.panell.actiu { display:block; }
.input-grup { margin-bottom:14px; }
.input-etiqueta { font-size:12px; font-weight:600; color:var(--text-suau); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
input[type=text], input[type=tel], input[type=date], input[type=password], textarea {
  width:100%; padding:10px 12px; border:1.5px solid var(--vora); border-radius:8px; font-size:14px; outline:none; font-family:inherit; background:#fff;
}
input:focus, textarea:focus { border-color:var(--blau); }
textarea { min-height:80px; resize:vertical; }
.btn { padding:10px 18px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
.btn-primari { background:var(--blau); color:#fff; width:100%; padding:12px; }
.btn-verd { background:var(--verd); color:#fff; }
.membre-avatar { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:#fff; flex-shrink:0; cursor:pointer; }
.av-a{background:#e74c3c;} .av-b{background:#3498db;} .av-c{background:#2ecc71;} .av-d{background:#f39c12;} .av-e{background:#9b59b6;} .av-f{background:#1abc9c;} .av-g{background:#e67e22;} .av-h{background:#34495e;}
.tag { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.tag-assaig { background:#eafaf1; color:#27ae60; }
.tag-actuacio { background:#eaebf5; color:#29327a; }
.tag-diada { background:#fef9e7; color:#f39c12; }
.fitxa-avatar-wrap { display:flex; justify-content:center; margin-bottom:20px; }
.fitxa-avatar { width:90px; height:90px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:700; color:#fff; cursor:pointer; position:relative; overflow:hidden; border:3px solid var(--blau); }
.fitxa-avatar:after { content:'📷'; position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.4); font-size:16px; text-align:center; padding:2px; }
.membre-selector { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.membre-chip { padding:6px 14px; border-radius:20px; background:var(--gris-clar); border:2px solid var(--vora); font-size:13px; font-weight:600; cursor:pointer; }
.membre-chip.actiu { background:var(--blau-clar); border-color:var(--blau); color:var(--blau); }
</style>

// Detectar token d'invitació o recuperació al fragment de la URL
async function detectaToken() {
  const hash = window.location.hash;
  const hashParams = new URLSearchParams(hash.replace('#', ''));
  const queryParams = new URLSearchParams(window.location.search);

  const type = hashParams.get('type') || queryParams.get('type');
  const accessToken = hashParams.get('access_token');
  const refreshToken = hashParams.get('refresh_token');
  const tokenHash = queryParams.get('token_hash') || queryParams.get('token');

  if (accessToken && (type === 'invite' || type === 'recovery' || type === 'signup' || type === 'magiclink')) {
    sessionStorage.setItem('sb-token', accessToken);
    if (refreshToken) sessionStorage.setItem('sb-refresh', refreshToken);
    sessionStorage.setItem('sb-canvia-pwd', '1');
    sessionStorage.setItem('primer-acces', '1');
    history.replaceState(null, '', window.location.pathname);
  } else if (tokenHash && type) {
    try {
      const res = await fetch('https://djxugrnyvbmziwttaszo.supabase.co/auth/v1/verify', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ token_hash: tokenHash, type })
      });
      if (res.ok) {
        const data = await res.json();
        sessionStorage.setItem('sb-token', data.access_token);
        if (data.refresh_token) sessionStorage.setItem('sb-refresh', data.refresh_token);
        sessionStorage.setItem('sb-canvia-pwd', '1');
        history.replaceState(null, '', window.location.pathname);
      }
    } catch(e) { console.error('Error verificant token:', e); }
  }
}

async function sbFetch(path, opts={}) {
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation',
    ...opts.headers
  };
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {...opts, headers});
  if (res.status === 401) { window.location.href = 'index.html'; return null; }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function sbAuth(path, opts={}) {
  const headers = {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...opts.headers};
  const res = await fetch(SUPABASE_URL + '/auth/v1/' + path, {...opts, headers});
  const text = await res.text();
  return {ok: res.ok, data: text ? JSON.parse(text) : null};
}

function tipusSessio(t) { return {assaig:'Assaig', actuacio:'Actuació', diada:'Diada'}[t]||t; }
function formatData(str) { if(!str)return''; return new Date(str+'T00:00:00').toLocaleDateString('ca-ES',{weekday:'long',day:'numeric',month:'long'}); }
function diaNum(str) { return str?new Date(str+'T00:00:00').getDate():''; }
function mesAbr(str) { return str?new Date(str+'T00:00:00').toLocaleDateString('ca-ES',{month:'short'}):''; }
function inicials(nom) { return nom.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase(); }
function colorAv(nom) { const colors=['av-a','av-b','av-c','av-d','av-e','av-f','av-g','av-h']; let h=0; for(let c of nom)h+=c.charCodeAt(0); return colors[h%colors.length]; }
function tagTipus(t) { return `<span class="tag tag-${t}">${tipusSessio(t)}</span>`; }

async function carrega() {
  // Obtenir fitxes del casteller
  const vinc = await sbFetch('membre_usuari?select=membre_id,membres(id,nom,foto,tel,notes,naixement)');
  if (!vinc || !vinc.length) {
    document.getElementById('cap-nom').textContent = 'Sense fitxa assignada';
    document.getElementById('contingut-fitxa').innerHTML = '<div class="buit"><div class="buit-ico">👤</div><div>El tècnic encara no ha assignat cap fitxa</div></div>';
    membres = [];
  } else {
    membres = vinc.map(v => v.membres);
    membreActiu = membres[0];
    document.getElementById('cap-nom').textContent = membres.map(m=>m.nom.split(' ')[0]).join(' · ');
    renderitzaChips();
    renderitzaFitxa();
  }

  // Carregar sessions
  const avui = new Date(); avui.setHours(0,0,0,0);
  const ara = new Date();
  const limitStr = `${ara.getFullYear()}-${String(ara.getMonth()+1).padStart(2,'0')}-${String(ara.getDate()).padStart(2,'0')}`;
  const all = await sbFetch(`sessions?select=*&data=gte.${limitStr}&order=data.asc`);
  sessions = all || [];
  renderitzaSessions();
}

async function processaFoto(input) {
  if (!input.files||!input.files[0]) return;
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      const maxSize=200; let w=img.width,h=img.height;
      if(w>h){if(w>maxSize){h=h*maxSize/w;w=maxSize;}}else{if(h>maxSize){w=w*maxSize/h;h=maxSize;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL('image/jpeg',0.6);
      membreActiu.foto=dataUrl;
      // Actualitzar avatar visualment
      renderitzaFitxa();
      // Desar
      await sbFetch(`membres?id=eq.${membreActiu.id}`, {method:'PATCH', body:JSON.stringify({foto:dataUrl})});
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function canviaContrasenya() {
  const pwd = document.getElementById('pwd-nou').value;
  const conf = document.getElementById('pwd-confirma').value;
  const err = document.getElementById('pwd-error');
  const ok = document.getElementById('pwd-ok');
  err.style.display='none'; ok.style.display='none';
  if (pwd.length < 6) { err.textContent='La contrasenya ha de tenir mínim 6 caràcters'; err.style.display='block'; return; }
  if (pwd !== conf) { err.textContent='Les contrasenyes no coincideixen'; err.style.display='block'; return; }
  const r = await sbAuth('user', {method:'PUT', body:JSON.stringify({password:pwd})});
  if (r.ok) {
    ok.textContent = '✓ Contrasenya desada!';
    ok.style.display='block';
    document.getElementById('pwd-nou').value='';
    document.getElementById('pwd-confirma').value='';
    // Si és el primer accés (venim d'una invitació), redirigir a sessions
    if (sessionStorage.getItem('primer-acces')) {
      sessionStorage.removeItem('primer-acces');
      setTimeout(() => { mostraPanell('sessions'); carrega(); }, 1200);
    }
  } else {
    err.textContent='Error en canviar la contrasenya'; err.style.display='block';
  }
}

function generaSVG(pinya, nomsAssignats) {
  const COLORS = {baix:'#1a1a2e',baix_pilar:'#1a1a2e',agulla:'#27ae60',crossa:'#f1c40f',contrafort:'#e8e8e8',vent:'#c0392b',lateral:'#2980b9',diagonal:'#2980b9',mans:'#8e44ad',tap:'#95a5a6',envoltant:'#27ae60'};
  const R=6.5, pos=pinya.posicions||[], nA=nomsAssignats||{};
  if(!pos.length)return'';
  const xs=pos.map(p=>p.cx),ys=pos.map(p=>p.cy);
  const marge=R+8,minX=Math.min(...xs)-marge,maxX=Math.max(...xs)+marge,minY=Math.min(...ys)-marge,maxY=Math.max(...ys)+marge;
  const cercles=pos.map(p=>{
    const color=COLORS[p.rol]||'#999';
    const nom=nA[p.id];
    let txt='';
    if(nom){
      const parts=nom.trim().split(' ');
      if(parts.length===1){
        txt=`<text x="${p.cx}" y="${p.cy+1}" text-anchor="middle" dominant-baseline="middle" font-size="3.8" font-weight="700" fill="#fff" font-family="sans-serif">${nom}</text>`;
      } else {
        // Dividir en dues línies: primer nom / resta
        const linia1=parts[0];
        const linia2=parts.slice(1).join(' ');
        txt=`<text x="${p.cx}" y="${p.cy-1.5}" text-anchor="middle" dominant-baseline="middle" font-size="3.5" font-weight="700" fill="#fff" font-family="sans-serif">${linia1}</text>
             <text x="${p.cx}" y="${p.cy+2.5}" text-anchor="middle" dominant-baseline="middle" font-size="3.2" font-weight="600" fill="rgba(255,255,255,0.85)" font-family="sans-serif">${linia2}</text>`;
      }
    }
    return `<circle cx="${p.cx}" cy="${p.cy}" r="${R}" fill="${color}" stroke="#fff" stroke-width="0.3" opacity="0.9"/>${txt}`;
  }).join('');
  return `<svg viewBox="${minX} ${minY} ${maxX-minX} ${maxY-minY}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;padding:8px;">${cercles}</svg>`;
}

function generaTroncHTML(cas, pinya) {
  const NOMS_PILARS={'2':['Carregada','Descarregada'],'3':['Rengla','Plena','Buida'],'3ag':['Rengla','Plena','Buida','Agulla'],'4':['Esquerra','Rengla','Dreta','Contra'],'5':['Rengla','Plena','Buida','Carregada','Descarregada']};
  const INDEX_BAIX={'2':[1,0],'3':[0,2,1],'3ag':[0,2,1,-1],'4':[3,2,1,0],'5':[0,1,2,3,4]};
  const tronc=pinya.tronc||[],aT=cas.assignacionsTronc||{},aP=cas.assignacions||{};
  const nPilars={pilar:1,'2':2,'3':3,'3ag':4,'4':4,'5':5}[pinya.tipus];
  if(!nPilars)return'';
  const noms=NOMS_PILARS[pinya.tipus]||[],mapa=INDEX_BAIX[pinya.tipus]||[];
  const baixos=(pinya.posicions||[]).filter(p=>p.rol==='baix');
  const baixPilar=(pinya.posicions||[]).find(p=>p.rol==='baix_pilar');
  const nT=cas.nomsTronc||{},nA=cas.nomsAssignats||{};
  const cols=`repeat(${nPilars},1fr)`;
  function cella(assignat,negre,nom){
    const bg=assignat?(negre?'#1a1a2e':'#29327a'):'#f0f0f0';
    const color=assignat?'#fff':'#ccc';
    const text=assignat?(nom||'✓'):'–';
    const fs=nom&&nom.length>6?'9px':'11px';
    return `<div style="background:${bg};color:${color};border-radius:6px;padding:4px 2px;text-align:center;font-size:${fs};font-weight:700;min-height:28px;display:flex;align-items:center;justify-content:center;overflow:hidden;">${text}</div>`;
  }
  const enx=tronc.find(t=>t.pis==='enxaneta');
  const acots=tronc.filter(t=>t.pis==='acotxador');
  const dosos=tronc.filter(t=>t.pis==='dos');
  let html='<div style="padding:12px 16px;border-bottom:1px solid #eee;">';
  html+='<div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">🏗️ Tronc</div>';

  if (pinya.tipus === 'pilar') {
    const ordre = ['enxaneta','acotxador','terços','segons'];
    ordre.forEach(pis => {
      const t = tronc.find(x => x.pis === pis);
      if(t) html+=`<div style="margin-bottom:4px;">${cella(!!aT[t.id],false,nT[t.id])}</div>`;
    });
    html+='<div style="border-top:1px dashed #ddd;margin:8px 0;"></div>';
    const posBaix = baixos[0];
    if(posBaix) html+=`<div style="margin-bottom:4px;">${cella(!!aP[posBaix.id],true,nA[posBaix.id])}</div>`;
  } else if (pinya.tipus === '3') {
    // Enxaneta i acotxador: ample complet. Dos: 1fr (Rengla) + 2fr (Plena+Buida)
    if(enx) html+=`<div style="margin-bottom:4px;">${cella(!!aT[enx.id],false,nT[enx.id])}</div>`;
    if(acots.length) html+=`<div style="margin-bottom:4px;">${cella(!!aT[acots[0].id],false,nT[acots[0].id])}</div>`;
    if(dosos.length>=2) html+=`<div style="display:grid;grid-template-columns:1fr 2fr;gap:4px;margin-bottom:4px;">${cella(!!aT[dosos[0].id],false,nT[dosos[0].id])}${cella(!!aT[dosos[1].id],false,nT[dosos[1].id])}</div>`;
  } else if (pinya.tipus === '3ag') {
    // Enxaneta i acotxador: 3fr + 1fr buit. Dos: 1fr + 2fr + 1fr buit
    if(enx) html+=`<div style="display:grid;grid-template-columns:3fr 1fr;gap:4px;margin-bottom:4px;"><div>${cella(!!aT[enx.id],false,nT[enx.id])}</div><div></div></div>`;
    if(acots.length) html+=`<div style="display:grid;grid-template-columns:3fr 1fr;gap:4px;margin-bottom:4px;"><div>${cella(!!aT[acots[0].id],false,nT[acots[0].id])}</div><div></div></div>`;
    if(dosos.length>=2) html+=`<div style="display:grid;grid-template-columns:1fr 2fr 1fr;gap:4px;margin-bottom:4px;">${cella(!!aT[dosos[0].id],false,nT[dosos[0].id])}${cella(!!aT[dosos[1].id],false,nT[dosos[1].id])}<div></div></div>`;
  } else if (pinya.tipus === '5') {
    const pomA=tronc.filter(t=>t.pilar===6), pomB=tronc.filter(t=>t.pilar===7);
    const acotA=pomA.find(t=>t.pis==='acotxador'), dosA=pomA.filter(t=>t.pis==='dos');
    const acotB=pomB.find(t=>t.pis==='acotxador'), dosB=pomB.filter(t=>t.pis==='dos');
    // Enxaneta: ample complet
    if(enx) html+=`<div style="margin-bottom:4px;">${cella(!!aT[enx.id],false,nT[enx.id])}</div>`;
    // Acotxadors i dosos a la mateixa fila: 3fr (Banda3) | 2fr (Banda2)
    html+=`<div style="display:grid;grid-template-columns:3fr 2fr;gap:6px;margin-bottom:4px;">
      <div>
        <div style="font-size:9px;font-weight:700;color:#888;text-align:center;margin-bottom:3px;">Banda del 3</div>
        ${acotA?`<div style="margin-bottom:3px;">${cella(!!aT[acotA.id],false,nT[acotA.id])}</div>`:''}
        ${dosA.length>=2?`<div style="display:grid;grid-template-columns:1fr 2fr;gap:4px;">${cella(!!aT[dosA[0].id],false,nT[dosA[0].id])}${cella(!!aT[dosA[1].id],false,nT[dosA[1].id])}</div>`:''}
      </div>
      <div>
        <div style="font-size:9px;font-weight:700;color:#888;text-align:center;margin-bottom:3px;">Banda del 2</div>
        ${acotB?`<div style="margin-bottom:3px;">${cella(!!aT[acotB.id],false,nT[acotB.id])}</div>`:''}
        ${dosB.length>=2?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;">${cella(!!aT[dosB[0].id],false,nT[dosB[0].id])}${cella(!!aT[dosB[1].id],false,nT[dosB[1].id])}</div>`:''}
      </div>
    </div>`;
  } else if (pinya.tipus === '2' || pinya.tipus === '4') {
    if(enx) html+=`<div style="margin-bottom:4px;">${cella(!!aT[enx.id],false,nT[enx.id])}</div>`;
    if(acots.length) html+=`<div style="margin-bottom:4px;">${cella(!!aT[acots[0].id],false,nT[acots[0].id])}</div>`;
    if(dosos.length) html+=`<div style="display:grid;grid-template-columns:repeat(${dosos.length},1fr);gap:4px;margin-bottom:4px;">${dosos.map(t=>cella(!!aT[t.id],false,nT[t.id])).join('')}</div>`;
  } else {
    if(enx)html+=`<div style="max-width:80px;margin:0 auto 4px;">${cella(!!aT[enx.id],false,nT[enx.id])}</div>`;
    if(acots.length){const w=acots.length===1?'max-width:80px;margin:0 auto 4px;':`display:grid;grid-template-columns:repeat(${acots.length},1fr);gap:4px;margin-bottom:4px;`;html+=`<div style="${w}">${acots.map(t=>cella(!!aT[t.id],false,nT[t.id])).join('')}</div>`;}
    if(dosos.length)html+=`<div style="display:grid;grid-template-columns:repeat(${dosos.length},1fr);gap:4px;margin-bottom:4px;">${dosos.map(t=>cella(!!aT[t.id],false,nT[t.id])).join('')}</div>`;
  }
  if (pinya.tipus !== 'pilar') {
    html+='<div style="border-top:1px dashed #ddd;margin:8px 0;"></div>';
    html+=`<div style="display:grid;grid-template-columns:${cols};gap:4px;margin-bottom:4px;">${Array.from({length:nPilars},(_,i)=>`<div style="text-align:center;font-size:9px;font-weight:600;color:#888;">${noms[i]||'P'+(i+1)}</div>`).join('')}</div>`;
    ['quartes','terços','segons'].forEach(pis=>{html+=`<div style="display:grid;grid-template-columns:${cols};gap:4px;margin-bottom:4px;">${Array.from({length:nPilars},(_,i)=>{const t=tronc.find(x=>x.pilar===i+1&&x.pis===pis);return cella(t&&!!aT[t.id],false,t&&nT[t.id]);}).join('')}</div>`;});
    html+='<div style="border-top:1px dashed #ddd;margin:8px 0;"></div>';
    html+=`<div style="display:grid;grid-template-columns:${cols};gap:4px;margin-bottom:4px;">${Array.from({length:nPilars},(_,i)=>{const idx=mapa[i];const pos=idx===-1?baixPilar:baixos[idx];return cella(pos&&!!aP[pos.id],true,pos&&nA[pos.id]);}).join('')}</div>`;
  }
  html+='</div>';
  return html;
}

function sortir() {
  if (!confirm('Vols tancar la sessió?')) return;
  sessionStorage.clear();
  window.location.href='index.html';
}
</script>

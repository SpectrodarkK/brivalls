name: Ping Supabase

on:
  schedule:
    # Cada 5 dies a les 8:00 UTC (dilluns, dijous, etc.)
    - cron: '0 8 */5 * *'
  workflow_dispatch: # Permet executar-lo manualment

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/sessions?select=id&limit=1" \
            > /dev/null
          echo "Ping fet a $(date)"
